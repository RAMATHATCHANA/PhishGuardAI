<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #1e3a8a;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    button:hover {
      background: #2563eb;
    }
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .info {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🛡️ PhishGuard</h1>
  
  <select id="language">
    <option value="en">English</option>
    <option value="ta">தமிழ்</option>
    <option value="te">తెలుగు</option>
    <option value="ml">മലയാളം</option>
    <option value="kn">ಕನ್ನಡ</option>
    <option value="hi">हिंदी</option>
  </select>

  <button id="scanBtn">Scan This Page</button>
  
  <div class="info">
    Click to scan the current page for phishing indicators
  </div>

  <script src="popup.js"></script>
</body>
</html>
